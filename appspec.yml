version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/ml
    overwrite: true
    exclude:
      - .gitignore
permissions:
  - object: /home/ec2-user/ml
    owner: ec2-user
    group: ec2-user
    mode: 755
hooks:
  BeforeInstall:
    - location: script/before.sh
      timeout: 300
      runas: ec2-user
  AfterInstall:
    - location: script/after_install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: script/start.sh
      timeout: 300
      runas: ec2-user